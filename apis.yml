- name: Verifone 3D Secure API
  description: >-
    SCA-compliant cardholder authentication with frictionless and challenge flows. The 3D Secure API provides
    Strong Customer Authentication (SCA) compliance through JWT-based flows, lookup functionality, and
    full 3DS authentication supporting both frictionless and challenge user experiences.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
