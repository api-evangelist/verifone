- name: Verifone VHQ Device Management API
  description: >-
    Remote device control and maintenance for POS terminal estates. The VHQ (VerifoneHQ) API enables automated
    device management, software deployment, health monitoring, application configuration, and real-time
    estate management for thousands of payment terminals. Integrates with existing systems to automate
    VHQ operations including geo-location support.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.verifone.com/vhq
