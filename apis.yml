apis:
- name: Verifone eCommerce API
  description: >-
    Global payments, recurring billing, and digital wallets — tokenized and PCI compliant. The eCommerce
    API handles customer payment info capture and order placement via direct server-to-server API calls,
    supporting tokenization, alternative payment methods, stored value cards, and BIN lookup across global
    regions.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.verifone.com/api-reference/open-api-references/ecommerce
