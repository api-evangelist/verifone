          type: string
          description: 'The status of the authorized payment.


            The possible values are:


            * CREATED. The authorized payment is created. No captured payments have been made for this authorized payment.

            * PARTIALLY_CREATED. The payment which was authorized for an amount that is less than the originally requested amount.

            * DENIED. PayPal cannot authorize funds for this authorized payment.

            * PENDING. The created authorization is in pending state. A manual review might be pending.'
    Capture_Payer_Info:
      type: object
      properties:
        payerId:
          type: string
          description: The PayPal-assigned ID for the payer
          pattern: ^[2-9A-HJ-NP-Z]{13}$
        name:
          $ref: '#/components/schemas/Payer_Name'
        phoneNumber:
          $ref: '#/components/schemas/Phone_number'
        email:
          type: string
          description: The email address of the payer.
          maxLength: 255
        shippingAddress:
          $ref: '#/components/schemas/Shipping-Address'
        paymentStatus:
          type: string
          description: 'The status of the captured payment.


            The possible values are:


            * COMPLETED. The funds for this captured payment were credited to the payee''s PayPal account.

            * DECLINED. The funds could not be captured.

            * PENDING. The funds for this captured payment was not yet credited to the payee''s PayPal account. A manual review might be pending.

            * FAILED. There was an error while capturing payment.'
